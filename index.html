vis.forEach(([x,y,z],i)=>{dm.position.set(x,y,z);dm.scale.setScalar(1);dm.updateMatrix();this.m.setMatrixAt(i,dm.matrix);let c=y>=6?0x9AA3DA:(y>=4?0x7C86C4:0x626CA8);if(z>=2&&Math.random()<0.07)c=0xFFE58A;this.m.setColorAt(i,col.set(c))});
this.m.instanceColor.needsUpdate=true;this.g.add(this.m);this.shT=-9;this.ex=null;this.pow=0}
tap(now,pow){this.shT=now;this.pow=pow;for(let i=0;i<3;i++)puff(0x9AA3DA,new THREE.Vector3(Math.random()*10-5,5+Math.random()*3,2),new THREE.Vector3(Math.random()*8-4,4+Math.random()*4,2),0.7,12,0.6)}
explode(now){this.ex={t0:now,v:this.p.map(p=>p.clone().sub(new THREE.Vector3(0,3,0)).normalize().multiplyScalar(9+Math.random()*10).add(new THREE.Vector3(0,5,0)))}}
update(now){const st=(now-this.shT)/1000;const amp=0.35+this.pow*0.15;const a=st<0.5?Math.exp(-6*st)*Math.sin(st*60)*amp:0;this.g.position.x=a;this.g.rotation.z=a*0.06;const sq=st<0.25?(1-st/0.25):0;this.g.scale.set(1+0.08*sq,1-0.07*sq,1);
if(this.ex){const t=(now-this.ex.t0)/1000;for(let i=0;i<this.p.length;i++){dm.position.copy(this.p[i]).addScaledVector(this.ex.v[i],t);dm.position.y-=9*t*t;dm.scale.setScalar(Math.max(0.01,1-t/0.7));dm.updateMatrix();this.m.setMatrixAt(i,dm.matrix)}this.m.instanceMatrix.needsUpdate=true;return t<0.75}return true}}
const parts=[];
function puff(color,pos,vel,life,grav,size,fade=true){const m=new THREE.MeshLambertMaterial({color,transparent:true});const c=new THREE.Mesh(GEO,m);c.scale.setScalar(size||0.5);c.position.copy(pos);scene.add(c);parts.push({o:c,m,v:vel,t0:performance.now(),life,grav,spin:Math.random()*6})}
function heart(top){const grp=new THREE.Group();const hm=new THREE.MeshLambertMaterial({color:0xFF7FA0,transparent:true});[[-1,1],[1,1],[-1,0],[0,0],[1,0],[0,-1]].forEach(([a,b])=>{const c=new THREE.Mesh(HG,hm);c.position.set(a*0.5,b*0.5,0);grp.add(c)});grp.position.set(Math.random()*8-4,top*0.7,5);scene.add(grp);parts.push({o:grp,m:hm,v:new THREE.Vector3((Math.random()-.5)*2,6,0),t0:performance.now(),life:1.4,grav:0,spin:3})}
function confetti(n,colors){for(let i=0;i<n;i++){const c=colors[i%colors.length];puff(c,new THREE.Vector3(0,5,1),new THREE.Vector3((Math.random()-.5)*26,10+Math.random()*12,(Math.random()-.5)*10),1.8,18,0.55)}}
// ---------- rendu ----------
const stageEl=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stageEl.appendChild(renderer.domElement);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(35,1,0.1,400);
scene.add(new THREE.AmbientLight(0xffffff,0.6));const dl=new THREE.DirectionalLight(0xffffff,0.75);dl.position.set(6,12,10);scene.add(dl);const dl2=new THREE.DirectionalLight(0xbfc6ff,0.35);dl2.position.set(-6,-2,-6);scene.add(dl2);
const shd=new THREE.Mesh(new THREE.CircleGeometry(1,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.18}));shd.rotation.x=-Math.PI/2;shd.position.y=-0.55;scene.add(shd);
let camY=5,camD=30,tY=5,tD=30,visW=20,visH=20;
function resize(){const w=stageEl.clientWidth,h=stageEl.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
function frameFor(top){tY=top*0.45;tD=Math.max(26,(top*0.5+4)/Math.tan(17.5*Math.PI/180),(top*0.75+3)/(Math.tan(17.5*Math.PI/180)*cam.aspect))}
// ---------- miniatures ----------
const THUMB={};
(function(){const r2=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r2.setSize(220,220);const sc2=new THREE.Scene();sc2.add(new THREE.AmbientLight(0xffffff,0.6));const d=new THREE.DirectionalLight(0xffffff,0.75);d.position.set(6,12,10);sc2.add(d);const c2=new THREE.PerspectiveCamera(30,1,0.1,300);
for(let si=0;si<3;si++)for(const r of RAR){const p=new P(si,r);p.root.rotation.y=-0.4;sc2.add(p.root);const w=si==2?13:9;const dd=Math.max(p.top,w*1.1)/(2*Math.tan(15*Math.PI/180))+6;c2.position.set(si==2?1:0,p.top*0.62,dd);c2.lookAt(si==2?1:0,p.top*0.46,0);r2.render(sc2,c2);THUMB[si+'-'+r]=r2.domElement.toDataURL();sc2.remove(p.root)}
r2.dispose()})();
// ---------- état du jeu ----------
const MAXE=20,REGEN=30000;
let S={en:MAXE,last:Date.now(),inv:{},seen:{},fav:null};
try{const raw=localStorage.getItem('plopi-proto-v1');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem('plopi-proto-v1',JSON.stringify(S))}catch(e){}}
function regen(){const now=Date.now();if(S.en>=MAXE){S.last=now;return}const k=Math.floor((now-S.last)/REGEN);if(k>0){S.en=Math.min(MAXE,S.en+k);S.last+=k*REGEN;if(S.en>=MAXE)S.last=now;save()}}
const enEl=document.getElementById('en'),enT=document.getElementById('enT'),dexEl=document.getElementById('dex');
function hud(){regen();enEl.textContent=S.en+'/'+MAXE;if(S.en<MAXE){const s=Math.ceil((REGEN-(Date.now()-S.last))/1000);enT.textContent='+1 dans '+s+' s'}else enT.textContent='';dexEl.textContent=Object.keys(S.seen).length+'/270'}
document.getElementById('plus').onclick=()=>{S.en=Math.min(99,S.en+10);save();hud()};
const toastEl=document.getElementById('toast');let toastT=0;function toast(t){toastEl.innerHTML=t;toastEl.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.opacity=0,1800)}
// ---------- modes ----------
let mode='disc',hab=null,discP=null,petP=null,phase='hab',tapsDone=0,need=4,touching=false,fx=0,fy=0,downT=0,moved=0,lx=0,ly=0,lastAct=performance.now(),lastZ=0;
const hintEl=document.getElementById('hint'),banEl=document.getElementById('banner'),contEl=document.getElementById('cont'),colEl=document.getElementById('col'),petInfo=document.getElementById('petinfo'),petHint=document.getElementById('pethint'),flashEl=document.getElementById('flash');
function clearScene(){if(hab){scene.remove(hab.g);hab=null}if(discP){scene.remove(discP.root);discP=null}if(petP){scene.remove(petP.root);petP=null}}
function newHab(){clearScene();hab=new Hab();scene.add(hab.g);tapsDone=0;need=3+Math.floor(Math.random()*5);phase='hab';hintEl.textContent='Touche le nuage';hintEl.style.opacity=0.9;banEl.classList.remove('on');contEl.style.display='none';shd.scale.setScalar(7);tY=4.5;tD=30}
function roll(){const r=Math.random();return r<0.05?'epique':r<0.30?'rare':'commun'}
function reveal(now){S.en--;regen();const rar=roll();const key='0-'+rar;const isNew=!S.seen[key];S.inv[key]=(S.inv[key]||0)+1;S.seen[key]=1;if(!S.fav)S.fav=key;save();hud();
hab.explode(now);hintEl.style.opacity=0;phase='reveal';
setTimeout(()=>{const t=performance.now();discP=new P(0,rar);scene.add(discP.root);discP.assemble(t);shd.scale.setScalar(5.5);frameFor(discP.top+2);
if(rar=='rare')confetti(26,[0xFFD95A,0xF0B429,0xFFF1A8]);if(rar=='epique'){confetti(60,[0xFF7EB3,0xFFD95A,0x7EF3C4,0x8FB4FF,0xD48BFF]);flashEl.classList.remove('go');void flashEl.offsetWidth;flashEl.classList.add('go')}
banEl.innerHTML='<div class="bn-name">Lunio Bébé</div><div class="bn-rar r-'+rar+'">'+RLAB[rar]+(rar=='commun'?'':rar=='rare'?' !':' !!')+'</div>'+(isNew?'<div class="bn-new">Nouveau !</div>':'');banEl.classList.add('on');
setTimeout(()=>{if(phase=='reveal')contEl.style.display='block'},1300)},320)}
contEl.onclick=e=>{e.stopPropagation();newHab()};
function setMode(m){mode=m;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
colEl.style.display=m=='col'?'block':'none';const showDisc=m=='disc';hintEl.style.display=showDisc?'block':'none';banEl.style.display=showDisc?'block':'none';contEl.style.visibility=showDisc?'visible':'hidden';petInfo.style.display=m=='pet'?'block':'none';petHint.style.display=m=='pet'?'block':'none';
if(m=='disc'){if(petP){scene.remove(petP.root);petP=null}if(!hab&&!discP)newHab();else{if(hab)scene.add(hab.g);if(discP)scene.add(discP.root)}}
if(m=='pet'){if(hab)scene.remove(hab.g);if(discP)scene.remove(discP.root);buildPet()}
if(m=='col'){renderCol()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function buildPet(){if(petP){scene.remove(petP.root);petP=null}if(!S.fav){petInfo.innerHTML='<div class="bn-name">Pas encore de Plopi</div><div class="sub">Va dans Découvrir pour trouver ton premier !</div>';petHint.style.display='none';return}
const[si,r]=S.fav.split('-');petP=new P(+si,r);scene.add(petP.root);shd.scale.setScalar(ST[+si].w+1.5);frameFor(petP.top+1);lastAct=performance.now();
petInfo.innerHTML='<div class="bn-name">Lunio '+ST[+si].n+'</div><div class="bn-rar r-'+r+'" style="font-size:16px">'+RLAB[r]+'</div>'}
// ---------- collection ----------
const NAMES=['Pétalou','Bourgeon','Pollinette','Trèflou','Roseraie','Ploufi','Bullo','Flaquette','Glagla','Arcelle','Doudo','Brizou','Pluvie','Soleillot','Plumeo','Flamichou','Cendrin','Mècho','Grillette','Volcanou','Lucio','Ombrinou','Hibou-Bou','Rêvéa','Cœurlette','Rigolo','Lumea','Souvenir','Somnia'];
function renderCol(){let lun=0;for(let si=0;si<3;si++)for(const r of RAR)if(S.seen[si+'-'+r])lun++;
let h='<h2>Plopidex</h2><div class="sub">'+Object.keys(S.seen).length+' / 270 versions trouvées · 3 doubles identiques = 1 évolution</div>';
h+='<div style="font-size:17px;font-weight:700;margin-bottom:6px">Lunio <span style="opacity:.6;font-weight:500;font-size:14px">· Nocturnes · '+lun+'/9</span></div><div class="grid"><div></div>';
RAR.forEach(r=>h+='<div class="gh r-'+r+'">'+RLAB[r]+'</div>');
for(let si=0;si<3;si++){h+='<div class="gl">'+ST[si].n+'</div>';for(const r of RAR){const k=si+'-'+r,n=S.inv[k]||0,seen=S.seen[k];h+='<div class="cell '+(seen?'':'no')+'" data-k="'+k+'"><img src="'+THUMB[k]+'">'+(seen?'<span class="cnt">×'+n+'</span>':'')+(n>=3&&si<2?'<span class="fu">fusion</span>':'')+'</div>'}}
h+='</div><div style="font-size:17px;font-weight:700;margin:18px 0 0">Les autres Plopis <span style="opacity:.6;font-weight:500;font-size:14px">· bientôt</span></div><div class="others">';NAMES.forEach(()=>h+='<div class="lk">?</div>');h+='</div>';
colEl.innerHTML=h;colEl.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{if(S.seen[c.dataset.k])openCard(c.dataset.k)})}
const modal=document.getElementById('modal'),mbox=document.getElementById('mbox');
function closeM(){modal.style.display='none'}
modal.onclick=e=>{if(e.target===modal)closeM()};
function openCard(k){const[si,r]=k.split('-');const n=S.inv[k]||0;const can=+si<2&&n>=3;const nk=(+si+1)+'-'+r;
mbox.innerHTML='<img class="big" src="'+THUMB[k]+'"><div class="t">Lunio '+ST[+si].n+'</div><div class="bn-rar r-'+r+'" style="font-size:16px">'+RLAB[r]+'</div><div class="c">Tu en as '+n+(n>1?' exemplaires':' exemplaire')+'</div>'+
(+si<2?'<button class="btn b1" id="fuse" '+(can?'':'disabled')+'>Fusionner 3 → Lunio '+ST[+si+1].n+'</button>'+(can?'':'<div class="c" style="margin:4px 0 0">Il t\'en faut 3 identiques</div>'):'<div class="c">Évolution maximale</div>')+
'<button class="btn b2" id="favb">'+(S.fav===k?'C\'est ton compagnon':'Choisir comme compagnon')+'</button><button class="btn b3" id="closeb">Fermer</button>';
modal.style.display='flex';document.getElementById('closeb').onclick=closeM;document.getElementById('favb').onclick=()=>{S.fav=k;save();closeM();setMode('pet')};
const fb=document.getElementById('fuse');if(fb&&can)fb.onclick=()=>fuse(k,nk)}
function fuse(k,nk){const[si,r]=k.split('-');mbox.innerHTML='<div class="fz"><img src="'+THUMB[k]+'" style="transform:translate(-90px,0)"><img src="'+THUMB[k]+'" style="transform:translate(0,-50px)"><img src="'+THUMB[k]+'" style="transform:translate(90px,0)"></div><div class="t">Fusion…</div>';modal.style.display='flex';
const imgs=mbox.querySelectorAll('.fz img');setTimeout(()=>imgs.forEach(i=>{i.style.transform='translate(0,0) scale(.6)';i.style.opacity=.6}),60);
setTimeout(()=>{S.inv[k]-=3;S.inv[nk]=(S.inv[nk]||0)+1;const isNew=!S.seen[nk];S.seen[nk]=1;S.fav=nk;save();hud();
mbox.innerHTML='<img class="big" src="'+THUMB[nk]+'" style="animation:pop .5s cubic-bezier(.3,1.6,.5,1)"><div class="t">Lunio '+ST[+si+1].n+' !</div><div class="bn-rar r-'+r+'" style="font-size:16px">'+RLAB[r]+'</div>'+(isNew?'<div class="bn-new">Nouveau !</div>':'')+'<button class="btn b1" id="see">Le voir</button><button class="btn b3" id="closeb">Fermer</button>';
document.getElementById('see').onclick=()=>{closeM();setMode('pet')};document.getElementById('closeb').onclick=()=>{closeM();renderCol()}},900)}
const st=document.createElement('style');st.textContent='@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}';document.head.appendChild(st);
// ---------- toucher ----------
function toWorld(e){const r=stageEl.getBoundingClientRect();const vh=2*camD*Math.tan(17.5*Math.PI/180),vw=vh*cam.aspect;fx=((e.clientX-r.left)/r.width-0.5)*vw;fy=camY+(0.5-(e.clientY-r.top)/r.height)*vh}
stageEl.addEventListener('pointerdown',e=>{touching=true;downT=performance.now();moved=0;lx=e.clientX;ly=e.clientY;toWorld(e);const now=performance.now();if(mode=='pet'&&petP&&now-lastAct>12000)petP.wake(now);lastAct=now});
stageEl.addEventListener('pointermove',e=>{if(!touching)return;moved+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);lx=e.clientX;ly=e.clientY;toWorld(e);lastAct=performance.now()});
stageEl.addEventListener('pointerup',()=>{touching=false;const now=performance.now();if(moved>12||now-downT>400)return;
if(mode=='disc'){if(phase=='hab'&&hab&&!hab.ex){if(S.en<=0){toast('Plus d\'énergie<br><small>+1 toutes les 30 s</small>');return}tapsDone++;hab.tap(now,tapsDone/need);const left=need-tapsDone;hintEl.textContent=left<=1?'Encore un…':['Il bouge !','Encore !','Ça tremble…','Presque…'][Math.min(3,tapsDone-1)];if(tapsDone>=need)reveal(now)}else if(phase=='reveal'&&discP&&!discP.asm)discP.tap(now)}
else if(mode=='pet'&&petP)petP.tap(now)});
stageEl.addEventListener('pointerleave',()=>{touching=false});
// ---------- boucle ----------
let lastHud=0;
function loop(now){requestAnimationFrame(loop);if(now-lastHud>500){lastHud=now;hud()}
if(mode=='disc'){if(hab&&!hab.update(now)){scene.remove(hab.g);hab=null}if(discP)discP.update(now,{touching,fx,fy})}
else if(mode=='pet'&&petP){const sl=now-lastAct>12000&&now>petP.surpriseEnd;petP.update(now,{touching,fx,fy,sleep:sl});if(sl&&now-lastZ>1300){lastZ=now;puff(0xB8C0D6,new THREE.Vector3(4,petP.top*0.8,2),new THREE.Vector3(0.6,3.2,0),2.4,0,0.5)}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i],t=(now-p.t0)/1000;if(t>p.life){scene.remove(p.o);parts.splice(i,1);continue}const dt=1/60;p.v.y-=p.grav*dt;p.o.position.addScaledVector(p.v,dt);p.o.rotation.y+=p.spin*dt;p.o.rotation.x+=p.spin*0.5*dt;p.m.opacity=Math.max(0,1-Math.max(0,t-p.life*0.6)/(p.life*0.4))}
camY+=(tY-camY)*0.08;camD+=(tD-camD)*0.08;cam.position.set(0,camY+camD*0.18,camD);cam.lookAt(0,camY,0);
renderer.render(scene,cam)}
resize();hud();newHab();requestAnimationFrame(loop);
</script>
